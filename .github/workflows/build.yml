name: build

# 跨平台构建验证 & 发布：
# - push/PR 到 main/master：仅验证编译通过（不打包发布）
# - 推送 v* tag：编译 + 打包 + 自动上传产物到 Release
on:
  push:
    branches: [main, master]
    tags: [v*]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 同一分支的新提交取消仍在跑的旧构建。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: dependency audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      # 仅 tag 发布检查版本、法律文档和角色再分发许可；普通 PR 不受素材门禁影响。
      - name: Release preflight
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npm run release:preflight -- "${{ github.ref_name }}"
      # 已记录且不可利用于打包运行时的间接 high/moderate 见 docs/dependency-risk-acceptance.md。
      # 新增 critical 漏洞直接阻止合并与发布。
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=critical
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ github.token }}
          working-directory: src-tauri

  build:
    name: build (${{ matrix.os }}-${{ matrix.arch }})
    needs: audit
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            os: macos
            arch: aarch64
            target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            os: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      # Linux：Tauri WebView(webkit2gtk) + 托盘(appindicator/libxdo) + 打包依赖。
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked --all-targets

      - name: Rust static checks
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      # push / PR：仅验证编译通过（不打包、不签名，避免 fork PR 无密钥时失败）
      - name: Build (compile verify — no bundle, no signing)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx tauri build --no-bundle --target ${{ matrix.target }}

      # tag：完整打包 + 用私钥签名生成 updater 产物（.sig）
      - name: Build (bundle + sign updater artifacts)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }}

      # 上传打包产物（仅 tag 构建产出 bundle；含安装包 + .sig 签名文件）
      - name: Upload build artifacts
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: kisaki-${{ matrix.os }}-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: warn

  # ── Release 上传 ──────────────────────────────────────────────
  # 仅在推送 v* tag 时将构建产物上传到对应的 GitHub Release。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [audit, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm ci

      # 正式角色包只允许打包 release-allowlist.json 中已确认再分发授权的角色。
      # 清单为空或许可记录不完整会阻止 tag 发布。
      - name: Build licensed starter character pack
        run: npm run pack:characters

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4

      # 确保 Release 存在（首次上传前创建，后续幂等）
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" &>/dev/null; then
            echo "Creating release $TAG ..."
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          else
            echo "Release $TAG already exists."
          fi

      - name: Upload artifacts to Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          echo "Uploading artifacts to Release: $TAG"
          for dir in kisaki-*/; do
            echo "  ── $dir ──"
            # 上传最终安装包 + 更新载荷（*.app.tar.gz / *.AppImage.tar.gz）
            find "$dir" -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.app.tar.gz" -o -name "*.AppImage.tar.gz" \) -print | while read -r file; do
              echo "    ↑ ${file#$dir}"
              gh release upload "$TAG" "$file" --clobber
            done
          done
          echo "✔ All artifacts uploaded to $TAG"

      # 汇总各平台 .sig 生成 latest.json（自动更新清单，url 指向本 Release）
      - name: Generate latest.json
        env:
          KISAKI_EXPECTED_PLATFORMS: windows-x86_64,darwin-aarch64,linux-x86_64
        run: node scripts/build-update-manifest.mjs "${{ github.ref_name }}" "${{ github.repository }}"

      - name: Upload latest.json to Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.ref_name }}" latest.json --clobber

      - name: Upload licensed starter character pack
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.ref_name }}" dist-packs/characters.zip --clobber

      - name: Generate and upload SHA-256 checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          find kisaki-* -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.app.tar.gz" \) -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum latest.json dist-packs/characters.zip >> SHA256SUMS.txt
          gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --clobber

      - name: Verify published release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run release:verify -- "${{ github.ref_name }}"
