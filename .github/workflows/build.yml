name: build

# 跨平台构建验证 & 发布：
# - push/PR 到 main/master：仅验证编译通过（不打包发布）
# - 推送 v* tag：编译 + 打包 + 自动上传产物到 Release
on:
  push:
    branches: [main, master]
    tags: [v*]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 同一分支的新提交取消仍在跑的旧构建。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]

    steps:
      - uses: actions/checkout@v4

      # Linux：Tauri WebView(webkit2gtk) + 托盘(appindicator/libxdo) + 打包依赖。
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build (frontend typecheck + bundle Tauri app)
        run: npm run tauri build

      # 上传打包产物（对所有分支/tag 都保留 artifacts）
      - name: Upload build artifacts (.msi / .exe / .dmg / .deb / .AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: kisaki-${{ runner.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: warn

  # ── Release 上传 ──────────────────────────────────────────────
  # 仅在推送 v* tag 时将构建产物上传到对应的 GitHub Release。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4

      # 确保 Release 存在（首次上传前创建，后续幂等）
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" &>/dev/null; then
            echo "Creating release $TAG ..."
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          else
            echo "Release $TAG already exists."
          fi

      - name: Upload artifacts to Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          echo "Uploading artifacts to Release: $TAG"
          for dir in kisaki-*/; do
            echo "  ── $dir ──"
            find "$dir" -type f | while read -r file; do
              echo "    ↑ ${file#$dir}"
              gh release upload "$TAG" "$file" --clobber
            done
          done
          echo "✔ All artifacts uploaded to $TAG"
