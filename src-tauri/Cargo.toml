[package]
name = "kisaki"
version = "0.2.8"
description = "Local-first AI desktop companion with customizable characters"
authors = ["AoralsFout"]
edition = "2021"
license = "MIT"
repository = "https://github.com/AoralsFout/Kisaki"
homepage = "https://kisaki.aoralsfout.top"
readme = "../README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kisaki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# 仅供内部测试构建。正式发布不得启用；release 默认在后端拒绝执行命令。
experimental-command = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10.9"
http = "1"
tokio = { version = "1", features = ["rt", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "default-tls"] }
tauri-plugin-dialog = "2.7.1"
zip = "2"
keyring = "2"
tauri-plugin-updater = "2.10.1"
